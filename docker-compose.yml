services:
  api:
    container_name: idea-box-api
    build: .
    ports:
      - "${IDEABOX_API_PORT:-3001}:3000"
    volumes:
      - ./db:/app/db
    environment:
      NODE_ENV: development
      PORT: 3000
      IDEABOX_DB_PATH: /app/db/db.sqlite
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be defined in ideabox/.env}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-3600}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,null}
    restart: unless-stopped
